  # Jane Street's role list lives in /jobs/main.json. Titles arrive with Lisu
  # homoglyphs swapped in for Latin capitals; the adapter folds them back.
  - {name: Jane Street, ats: janestreet, tier: 1}
  - name: D. E. Shaw
    ats: html
    tier: 1
    url: "https://www.deshaw.com/careers/choose-your-path"
    link_pattern: "/careers/"
    base: "https://www.deshaw.com"
  # Citadel and Citadel Securities run their own portal; no public JSON board
