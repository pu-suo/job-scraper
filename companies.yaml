# ============================================================================
# companies.yaml - the target list
#
# tier 0 = FAANG+ and frontier AI labs         -> HOT lane, polled every ~3 min
# tier 1 = big tech / top quant / top startups -> HOT lane
# tier 2 = strong mid-size                     -> COLD lane, ~30 min
# tier 3 = volume / long tail                  -> COLD lane
#
# Every token in this file was verified against the live API on 2026-08-17.
# They still drift - companies switch ATS mid-cycle - so re-run
# `python -m radar verify` every couple of weeks and after any `doctor`
# report shows a board going quiet.
#
# `enabled: false` entries are boards with NO working public JSON endpoint as
# of the last sweep. They are kept here, documented, so a real gap never
# looks like an oversight. Each one names what it actually runs on; if you
# want it back, find the token with `python -m radar discover <slug>`.
# ============================================================================

companies:

  # ------------------------------------------------------------------ TIER 0
  - {name: Amazon,      ats: amazon,     tier: 0, search: "intern"}
  # Apple's search ignores "intern" and returns the whole corpus; "internship"
  # is the query that actually filters. Don't change this without re-testing.
  - {name: Apple,       ats: apple,      tier: 0, search: "internship"}
  - {name: Anthropic,   ats: greenhouse, tier: 0, token: anthropic}
  - {name: OpenAI,      ats: ashby,      tier: 0, token: openai}
  - {name: Databricks,  ats: greenhouse, tier: 0, token: databricks}
  - {name: NVIDIA,      ats: workday,    tier: 0, tenant: nvidia, dc: wd5, site: NVIDIAExternalCareerSite}

  # Google's careers results page is server-rendered, so the `google` adapter
  # reads job ids + slugs straight out of the HTML. No JS engine needed.
  - {name: Google,      ats: google,     tier: 0, search: "intern"}

  # Meta has no search API. The `meta` adapter diffs metacareers.com's job
  # sitemap (~840 live reqs, one request) and only opens detail pages it has
  # never seen, reading the schema.org JobPosting block. The first few hours
  # backfill at max_hydrate reqs per poll, then it settles to 1 request.
  - {name: Meta,        ats: meta,       tier: 0, max_hydrate: 25}

  # Netflix runs on Eightfold.
  - {name: Netflix,     ats: eightfold,  tier: 0, host: explore.jobs.netflix.net, domain: netflix.com, search: "intern"}

  # Microsoft: NO WORKING PUBLIC BOARD as of Aug 2026. They retired
  # gcsservices.careers.microsoft.com (its TLS cert no longer covers the
  # hostname) and moved to an Eightfold tenant at apply.careers.microsoft.com
  # whose API rejects anonymous callers ("Not authorized for PCSX"). Use
  # Microsoft's own email job alerts as the stopgap - this is the single
  # biggest coverage gap in the file.
  - {name: Microsoft,   ats: microsoft,  tier: 0, enabled: false}

