name: intern radar

# GitHub's cron minimum is 5 minutes and it is frequently delayed by 5-15
# minutes under load, so this is your *fallback*, not your fast path. For
# true 3-minute latency run `python -m radar watch` on an always-on machine
# (a $5 VPS, a Raspberry Pi, or an old laptop in a drawer).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Restore the dedupe DB so you don't get re-notified about every
      # posting on every run. Without this the first run of each cycle
      # would re-alert on all ~100 live postings.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      # Secrets are read straight from the environment - nothing sensitive is
      # ever written to config.yaml, which matters because this repo is public.
      - name: Poll
        env:
          RADAR_SMTP_PASSWORD: ${{ secrets.RADAR_SMTP_PASSWORD }}
          RADAR_NTFY_TOPIC: ${{ secrets.RADAR_NTFY_TOPIC }}
          RADAR_DISCORD_WEBHOOK: ${{ secrets.RADAR_DISCORD_WEBHOOK }}
        run: python -m radar run --lane all -v

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
